<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            color: #00d4ff;
        }

        p {
            color: #cccccc;
            line-height: 1.6;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #00d4ff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Welcome to My Website!</h1>
    <p>Built with HTML, CSS and JavaScript.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("My website is working!");
        }
    </script>
</body>
</html>
